repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --project api ruff check --fix
        language: system
        types: [python]
        files: ^api/

      - id: ruff-format
        name: ruff format
        entry: uv run --project api ruff format
        language: system
        types: [python]
        files: ^api/

      - id: pyright
        name: pyright
        entry: uv run --directory api pyright
        language: system
        types: [python]
        pass_filenames: false
        files: ^api/

      - id: deno-fmt
        name: deno fmt
        entry: bash -c 'cd web && deno fmt .'
        language: system
        pass_filenames: false
        files: ^web/

      - id: deno-lint
        name: deno lint
        entry: bash -c 'cd web && deno lint .'
        language: system
        pass_filenames: false
        files: ^web/

      - id: deno-check
        name: deno check
        entry: bash -c 'cd web && deno check main.ts'
        language: system
        pass_filenames: false
        files: ^web/
