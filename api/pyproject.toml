[project]
name = "librarian"
version = "0.1.0"
description = "AI Knowledge Gateway"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.4.1",
    "cragents @ git+https://github.com/g-eoj/cragents@v0.1.0",
    "fastapi>=0.128.0",
    "langchain-text-splitters>=1.1.0",
    "logfire>=4.19.0",
    "markdownify>=1.2.2",
    "playwright>=1.57.0",
    "pydantic-ai",
    "requests-cache>=1.2.1",
    "transformers>=4.57.6",
    "uvicorn>=0.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["librarian"]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pre-commit>=4.5.1",
    "pyright",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=librarian --cov-report=term-missing -q"

[tool.coverage.run]
source = ["librarian"]
omit = ["tests/*"]

[tool.pyright]
include = ["librarian"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
